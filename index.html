<script>
const GOOGLE_CLIENT_ID = "57045846413-tgddgirr6b5cjskf3k5jf9g4rkagn8p0.apps.googleusercontent.com";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.readonly";
const TARGET_FOLDER_ID = "p0j0hSPDRRn9u";

let usersDatabase = JSON.parse(localStorage.getItem("khUsers")) || [
  { user: "Ronel", pass: "gege@635185", role: "admin" },
  { user: "singer", pass: "1234", role: "user" }
];

let currentUser = null;
let isAdminMode = false;
let currentCategory = "ktv";
let tokenClient = null;
let gapiInited = false;
let gsiInited = false;

const state = {
  driveFiles: [],
  localFiles: [],
  queue: [],
  currentIndex: -1,
  playing: false,
  singer: "Singer"
};

const $ = id => document.getElementById(id);
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.style.display = "none"; }, 3000);
}

window.addEventListener('DOMContentLoaded', () => {
  setupAppAuth();
  setupUIEventListeners();
  
  // Clear stale token on load so status starts clean as "Not logged in"
  localStorage.removeItem('karaoke_auth_token');
  $("driveStatusミュニ").textContent = "Not logged in";
});

function setupAppAuth() {
  const savedSession = localStorage.getItem("khActiveUser");
  if (savedSession) {
    try {
      const userObj = JSON.parse(savedSession);
      const exists = usersDatabase.find(u => u.user.toLowerCase() === userObj.user.toLowerCase() && u.pass === userObj.pass);
      if (exists) applyUserSession(exists);
    } catch (e) { localStorage.removeItem("khActiveUser"); }
  }

  $("loginAppBtn").onclick = () => {
    const user = $("appUsernameInput").value.trim();
    const pass = $("appPasswordInput").value.trim();
    const matched = usersDatabase.find(u => u.user.toLowerCase() === user.toLowerCase() && u.pass === pass);
    if (matched) {
      localStorage.setItem("khActiveUser", JSON.stringify(matched));
      applyUserSession(matched);
      toast(`Welcome, ${matched.user}!`);
    } else {
      toast("Invalid username or password!");
    }
  };

  $("logoutAppBtn").onclick = () => {
    currentUser = null;
    localStorage.removeItem("khActiveUser");
    localStorage.removeItem("karaoke_auth_token");
    document.body.classList.remove("is-admin");
    $("appAuthGate").style.display = "flex";
    $("driveStatus").textContent = "Not logged in";
    toast("Logged out successfully.");
  };
}

function applyUserSession(userObj) {
  currentUser = userObj;
  isAdminMode = userObj.role === "admin";
  $("activeUserLabel").textContent = userObj.user;
  if (isAdminMode) document.body.classList.add("is-admin");
  else document.body.classList.remove("is-admin");
  $("appAuthGate").style.display = "none";
  renderFiles();
}

function setupUIEventListeners() {
  $("settingsButton").onclick = () => { $("singerInput").value = state.singer; $("settingsModal").classList.add("show"); };
  $("closeSettings").onclick = () => $("settingsModal").classList.remove("show");
  $("saveSettings").onclick = () => {
    state.singer = $("singerInput").value.trim() || "Singer";
    $("settingsModal").classList.remove("show");
    toast(`Singer updated to: ${state.singer}`);
  };

  $("loginButton").onclick = () => {
    if (tokenClient) {
      tokenClient.requestAccessToken({ prompt: 'consent' });
    } else {
      toast("Google API initializing, please try again in a moment.");
    }
  };

  $("selectLocalFiles").onclick = () => $("localFilesInput").click();
  $("localFilesInput").onchange = (e) => {
    state.localFiles = Array.from(e.target.files);
    $("localStatus").textContent = `📁 Loaded • ${state.localFiles.length} file(s)`;
    renderFiles();
    toast(`Loaded ${state.localFiles.length} local files.`);
  };

  $("search").oninput = () => renderFiles();

  $("playButton").onclick = () => {
    if (state.queue.length === 0) return toast("Queue is empty!");
    state.playing = !state.playing;
    $("playButton").textContent = state.playing ? "⏸" : "▶";
    toast(state.playing ? "Playback started" : "Playback paused");
  };
  $("stopButton").onclick = () => {
    state.playing = false;
    $("playButton").textContent = "▶";
    toast("Playback stopped");
  };
}

function gapiLoaded() {
  gapi.load('client', initializeGapiClient);
}
function gsiLoaded() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: (resp) => {
      if (resp.error) return toast("Google Auth Error: " + resp.error);
      localStorage.setItem('karaoke_auth_token', resp.access_token);
      initGoogleAuth(resp.access_token);
    }
  });
  gsiInited = true;
}

async function initializeGapiClient() {
  await gapi.client.init({ discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"] });
  gapiInited = true;
}

async function initGoogleAuth(token) {
  gapi.client.setToken({ access_token: token });
  $("driveStatus").textContent = "Google Drive Connected";
  loadDriveFolder(TARGET_FOLDER_ID);
}

async function loadDriveFolder(folderId) {
  try {
    if (!gapi.client || !gapi.client.drive) {
      throw new Error("GAPI client not initialized");
    }
    const res = await gapi.client.drive.files.list({
      q: `'${folderId}' in parents and (mimeType contains 'audio/' or mimeType contains 'video/' or mimeType = 'application/vnd.google-apps.folder') and trashed = false`,
      fields: "files(id, name, mimeType)"
    });
    state.driveFiles = res.result.files || [];
    $("driveStatus").textContent = `Connected • ${state.driveFiles.length} file(s)`;
    renderFiles();
  } catch (err) {
    console.error("Drive load error:", err);
    $("driveStatus").textContent = "Drive sync error - Please log in again";
    localStorage.removeItem('karaoke_auth_token');
  }
}

function setCategory(cat) {
  currentCategory = cat;
  $("catKtv").classList.toggle("active", cat === 'ktv');
  $("catMusic").classList.toggle("active", cat === 'music');
  $("catMovie").classList.toggle("active", cat === 'movie');
  renderFiles();
}

function renderFiles() {
  const container = $("files");
  container.innerHTML = "";
  const query = ($("search").value || "").toLowerCase();

  const allItems = [...state.localFiles.map(f => ({ name: f.name, type: 'local', file: f })), ...state.driveFiles.map(f => ({ name: f.name, type: 'drive', file: f }))];
  const filtered = allItems.filter(item => item.name.toLowerCase().includes(query));

  if (filtered.length === 0) {
    container.innerHTML = `<div style="padding:20px;text-align:center;color:#555;">No media files found.</div>`;
    return;
  }

  filtered.forEach(item => {
    const div = document.createElement("div");
    div.className = "file";
    div.innerHTML = `
      <div>
        <div class="file-title">${item.name}</div>
        <div class="file-meta">${item.type.toUpperCase()} • Ready</div>
      </div>
      <button class="btn small primary">+ Queue</button>
    `;
    div.querySelector("button").onclick = () => {
      state.queue.push(item);
      renderQueue();
      toast(`Added to queue: ${item.name}`);
    };
    container.appendChild(div);
  });
}

function renderQueue() {
  const container = $("queue");
  container.innerHTML = "";
  state.queue.forEach((item, idx) => {
    const qItem = document.createElement("div");
    qItem.className = "queue-item";
    qItem.innerHTML = `
      <div style="font-weight:bold; color:var(--pink);">${idx + 1}</div>
      <div style="font-size:12px; font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.name}</div>
      <button class="btn red small" onclick="removeFromQueue(${idx})">✕</button>
    `;
    container.appendChild(qItem);
  });
}

function removeFromQueue(idx) {
  state.queue.splice(idx, 1);
  renderQueue();
}
</script>
