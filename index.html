<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KaraokeHub PRO</title>
  
  <!-- PWA Headers & Theme Configurations -->
  <meta name="theme-color" content="#e91e63">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">

  <!-- Production Dependencies Sourced Locally to Bypass Network Block Filters -->
  <script src="./lib/supabase.js"></script>
  <script src="https://unpkg.com"></script>

  <!-- Complete Component Dashboard UI Stylesheet -->
  <style>
    :root {
      --bg-main: #121214;
      --bg-panel: #1a1a1e;
      --accent: #e91e63;
      --accent-hover: #ff2a75;
      --text-main: #ffffff;
      --text-muted: #9ca3af;
      --green: #10b981;
      --red: #ef4444;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      user-select: none;
    }

    /* PWA TACS-Branded Animated Standalone Splash Mask Layer */
    @media (display-mode: standalone) {
      .pwa-splash-fallback {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        background: #121214;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      .splash-logo {
        width: 160px;
        height: 160px;
        background: url('./icons/icon-512x512.png') no-repeat center;
        background-size: contain;
        animation: pulse 2s infinite ease-in-out;
      }
      @keyframes pulse {
        0% { transform: scale(0.96); opacity: 0.8; }
        50% { transform: scale(1.03); opacity: 1; }
        100% { transform: scale(0.96); opacity: 0.8; }
      }
    }
    @media not (display-mode: standalone) {
      .pwa-splash-fallback { display: none !important; }
    }

    /* Application Layout Container Mapping onto Screenshot */
    .app-container {
      display: grid;
      grid-template-rows: 60px 1fr 100px;
      height: 100vh;
      width: 100vw;
    }

    /* Top Action Bar Navigation */
    .top-header {
      background-color: var(--bg-panel);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid #27272a;
    }
    .brand {
      font-weight: 800;
      font-size: 1.4rem;
      color: var(--text-main);
    }
    .brand span { color: var(--accent); }
    
    .nav-actions button {
      background: #27272a;
      color: white;
      border: none;
      padding: 8px 14px;
      margin-left: 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .nav-actions .btn-login { background-color: var(--accent); }

    /* Central Sing Studio Split Columns Workspace */
    .main-workspace {
      display: grid;
      grid-template-columns: 300px 1fr 320px;
      overflow: hidden;
    }

    .sidebar-panel {
      background-color: var(--bg-panel);
      border-right: 1px solid #27272a;
      display: flex;
      flex-direction: column;
      padding: 15px;
    }
    .sidebar-panel h3 { margin-top: 0; font-size: 1rem; letter-spacing: 0.5px; border-bottom: 1px solid #27272a; padding-bottom: 8px;}
    
    /* Upload button display container adjustments */
    .upload-container {
      margin-bottom: 12px;
    }
    .btn-upload {
      background-color: #27272a;
      color: white;
      border: 1px dashed #4b5563;
      padding: 10px;
      display: block;
      width: calc(100% - 22px);
      text-align: center;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-upload:hover {
      background-color: #3f3f46;
    }

    .track-scroller {
      flex: 1;
      overflow-y: auto;
    }
    .track-row {
      padding: 10px;
      border-radius: 4px;
      background: #27272a;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .track-row:hover { background: #3f3f46; }
    .track-info { display: flex; flex-direction: column; }
    .track-title { font-weight: 600; font-size: 0.9rem; text-transform: uppercase; }
    .track-artist { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
    .btn-reserve {
      background: var(--accent);
      border: none; color: white; border-radius: 3px;
      padding: 4px 8px; font-size: 0.75rem; cursor: pointer;
    }

    /* Center Screen Visual Theater Output Area */
    .theater-stage {
      background-color: #09090b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 20px;
    }
    .lyric-window {
      text-align: center;
      max-height: 300px;
      width: 100%;
    }
    .lyric-line {
      font-size: 2rem;
      font-weight: 800;
      margin: 15px 0;
      text-transform: uppercase;
      transition: all 0.2s linear;
      color: #4b5563;
    }
    .lyric-line.active {
      color: #ffffff;
      text-shadow: 0 0 12px var(--accent), 0 0 24px var(--accent);
      transform: scale(1.1);
    }
    .lyric-line.passed { color: #fb923c; opacity: 0.4; }

    /* Right Side Live Singer Queue Panel */
    .queue-panel {
      background-color: var(--bg-panel);
      border-left: 1px solid #27272a;
      display: flex;
      flex-direction: column;
      padding: 15px;
    }
    .queue-list { flex: 1; overflow-y: auto; }
    .queue-item {
      padding: 10px; background: #27272a;
      border-left: 4px solid var(--accent);
      margin-bottom: 8px; border-radius: 0 4px 4px 0;
      font-size: 0.85rem;
    }
    .queue-triggers button {
      width: 100%; padding: 12px; margin-top: 8px;
      border: none; border-radius: 4px; font-weight: 700; cursor: pointer;
    }
    .btn-start-queue { background-color: var(--green); color: white; }
    .btn-clear-queue { background-color: var(--red); color: white; }

    /* Bottom Matrix Audio Hardware Parameters Slider Dashboard */
    .bottom-dashboard {
      background-color: var(--bg-panel);
      border-top: 1px solid #27272a;
      display: grid;
      grid-template-columns: 240px 1fr;
      align-items: center;
      padding: 0 20px;
    }
    .transport-cluster { display: flex; gap: 10px; }
    .btn-transport {
      width: 44px; height: 44px; border-radius: 50%;
      border: none; background: #27272a; color: white;
      font-size: 1.1rem; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
    }
    .btn-transport.play-accent { background-color: var(--accent); }
    
    .sliders-cluster {
      display: flex;
      justify-content: space-around;
      gap: 20px;
    }
    .slider-box {
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .slider-box label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; font-weight: 700;}
    .slider-box label span { color: white; float: right;}
    input[type="range"] {
      accent-color: var(--accent);
      background: #27272a;
      height: 6px; border-radius: 3px; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- PWA Standalone Splash Layout View Node -->
  <div class="pwa-splash-fallback" id="pwaSplash">
    <div class="splash-logo"></div>
  </div>

  <!-- Primary Application Dashboard View Port Frame -->
  <div class="app-container">
    
    <!-- Top Action Bar Global Navigation Grid -->
    <header class="top-header">
      <div class="brand">KaraokeHub <span>PRO</span></div>
      <div class="nav-actions">
        <button class="btn-login" id="loginBtn" onclick="toggleAuthMock()">Log in with Google</button>
        <button onclick="alert('Manage Users Administration Framework Active')">Manage Users</button>
        <button onclick="alert('TV Stage Projector Layout Configuration Node Activated')">TV Stage</button>
      </div>
    </header>

    <!-- Central Interactive Workspace splits -->
    <main class="main-workspace">
      
      <!-- Left Column: Media Library Featuring the Custom Folder Upload Element -->
      <section class="sidebar-panel">
        <h3>LOCAL SONG LIBRARY</h3>
        <div class="upload-container">
          <label for="folderPicker" class="btn-upload">📁 SELECT LOCAL KARAOKE FOLDER</label>
          <input type="file" id="folderPicker" webkitdirectory directory multiple style="display: none;" onchange="handleFolderUpload(this.files)">
        </div>
        <div class="track-scroller" id="trackList">
          <p style="font-size:0.85rem; color:var(--text-muted)">Please upload a local karaoke folder to list songs.</p>
        </div>
      </section>

      <!-- Center Theater Module Box: Lyric Timeline Synchronization Render Panel -->
      <section class="theater-stage" id="stageContainer">
        <div class="lyric-window" id="lyricContainer">
          <div class="lyric-line active">READY TO PLAY</div>
          <div class="lyric-line">Select a track from the local library column to initialize timeline parsing</div>
        </div>
      </section>

      <!-- Right Column: Live Singer Reservation Queue Management Panel -->
      <section class="queue-panel">
        <h3>SINGER QUEUE</h3>
        <div class="queue-list" id="queueContainer">
          <p style="font-size:0.85rem; color:var(--text-muted)">No tracks currently reserved in active singer loops.</p>
        </div>
        <div class="queue-triggers">
          <button class="btn-start-queue" onclick="advancePlaybackQueue()">▶ START QUEUE</button>
        <div class="slider-box">
          <label id="pitchLabel">KEY / PITCH: <span>0 semitones</span></label>
          <input type="range" min="-6" max="6" step="1" value="0" id="pitchSlider" oninput="adjustHardwarePitch(this.value)">
        </div>
        <div class="slider-box">
          <label id="tempoLabel">TEMPO: <span>100%</span></label>
          <input type="range" min="70" max="130" step="5" value="100" id="tempoSlider" oninput="adjustHardwareTempo(this.value)">
        </div>
        <div class="slider-box">
          <label id="volumeLabel">MUSIC VOLUME: <span>100%</span></label>
          <input type="range" min="0" max="100" value="100" id="volumeSlider" oninput="adjustHardwareVolume(this.value)">
        </div>
        <div class="slider-box">
          <label id="micLabel">MICROPHONE: <span>0%</span></label>
          <input type="range" min="0" max="100" value="0" id="micSlider" oninput="adjustHardwareMic(this.value)">
        </div>
      </div>
    </footer>
  </div>

  <script>
    // --- 1. SUPABASE REAL-TIME CONNECTION ENGINE ---
    const SUPABASE_URL = "https://supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Ftro51fz2tJtgFbQzhq4uw_Txmc_";
    
    let supabaseClient = null;
    let fallbackSongData = [
      { id: 1, title: "Akin Ka Na Lang", artist: "Morissette Amon", path: "akin.mid" },
      { id: 2, title: "All At Once", artist: "Whitney Houston", path: "all_at_once.mid" },
      { id: 3, title: "All The Love In The World", artist: "The Corrs", path: "corrs.mid" }
    ];

    try {
      if (typeof supabase !== 'undefined' && SUPABASE_URL.indexOf("your-project-id") === -1) {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch(err) {
      console.warn("Using baseline local offline sandbox data engine arrays.");
    }

    // --- 2. GLOBAL CONTROLLER RUNTIME DATA LAYERS ---
    let appState = {
      songLibrary: [],
      localFolderFiles: [],
      singerQueue: [],
      currentSong: null,
      isPlaying: false,
      playbackTime: 0,
      pitchShift: 0,
      tempoScale: 100,
      timerLoop: null,
      activeLyrics: []
    };

    let audioCtx = null;

    function adjustHardwarePitch(value) {
      appState.pitchShift = parseInt(value);
      document.getElementById("pitchLabel").querySelector("span").innerText = `${value > 0 ? '+' : ''}${value} semitones`;
    }

    function adjustHardwareTempo(value) {
      appState.tempoScale = parseInt(value);
      document.getElementById("tempoLabel").querySelector("span").innerText = `${value}%`;
    }

    function adjustHardwareVolume(value) {
      document.getElementById("volumeLabel").querySelector("span").innerText = `${value}%`;
    }

    async function adjustHardwareMic(value) {
      document.getElementById("micLabel").querySelector("span").innerText = `${value}%`;
      if (parseInt(value) > 0) {
        try {
          await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch(err) {
          console.warn("Hardware mic streams blocked by browser permission matrix settings.");
        }
      }
    }

    // --- 3. UNBLOCKED LOCAL DISK FILE SYSTEM DIRECTORY UPLOAD HANDLER ---
    function handleFolderUpload(files) {
      if (!files || files.length === 0) return;
      
      appState.localFolderFiles = [];
      let uniqueId = 1000;

      console.log(`Processing folder batch list: ${files.length} items discovered.`);

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const rawName = file.name ? file.name : "";
        const lowerName = rawName.toLowerCase();
        
        // Case-insensitive verification validation parameters checks
        if (lowerName.endsWith('.mid') || lowerName.endsWith('.midi') || lowerName.endsWith('.mp4') || lowerName.endsWith('.mp3')) {
          let title = rawName.replace(/\.[^/.]+$/, ""); // Strip extensions out
          let artist = "Local Directory Track";
          
          if (title.includes("-")) {
            const parts = title.split("-");
            artist = parts[0].trim();
            title = parts[1].trim();
          }

          appState.localFolderFiles.push({
            id: uniqueId++,
            title: title,
            artist: artist,
            fileRef: file, 
            format: lowerName.endsWith('.mp4') ? 'VIDEO' : 'MIDI'
          });
        }
      }
      
      console.log(`Successfully mapped ${appState.localFolderFiles.length} karaoke tracks into runtime state layers.`);
      updateSidebarTracks();
    }

    // --- 4. DATA PRESENTATION UTILS AND TIMELINES SYNCHRONIZATIONS ---
    function updateSidebarTracks() {
      const container = document.getElementById("trackList");
      if (!container) return;
      
      // Checking local disc folder cache layers first before checking database response lists
      const tracksToRender = (appState.localFolderFiles && appState.localFolderFiles.length > 0)
        ? appState.localFolderFiles 
        : appState.songLibrary;

      if (!tracksToRender || tracksToRender.length === 0) {
        container.innerHTML = "";
        fallbackSongData.forEach(track => {
          const row = document.createElement("div");
          row.className = "track-row";
          row.innerHTML = `
            <div class="track-info" onclick="loadSelectedTrackImmediately(${track.id})">
              <span class="track-title">${track.title}</span>
              <span class="track-artist">${track.artist} (PREVIEW)</span>
            </div>
            <button class="btn-reserve" onclick="reserveSongTrack(${track.id})">+ Queue</button>
          `;
          container.appendChild(row);
        });
        return;
      }

      container.innerHTML = "";
      
      tracksToRender.forEach(track => {
        const row = document.createElement("div");
        row.className = "track-row";
        row.innerHTML = `
          <div class="track-info" onclick="loadSelectedTrackImmediately(${track.id})">
            <span class="track-title">${track.title}</span>
            <span class="track-artist">${track.artist || 'Unknown Artist'}</span>
          </div>
          <button class="btn-reserve" onclick="reserveSongTrack(${track.id})">+ Queue</button>
        `;
        container.appendChild(row);
      });
    }

    function populateMediaLibrary() {
      updateSidebarTracks();
    }

    function reserveSongTrack(id) {
      const tracks = appState.localFolderFiles.length > 0 ? appState.localFolderFiles : (appState.songLibrary.length > 0 ? appState.songLibrary : fallbackSongData);
      const song = tracks.find(t => t.id === id);
      const singer = prompt("Enter Singer Name:") || "Guest";
      appState.singerQueue.push({ ...song, queueId: Date.now(), singer });
      renderQueueUI();
    }

    function renderQueueUI() {
      const container = document.getElementById("queueContainer");
      if (appState.singerQueue.length === 0) {
        container.innerHTML = `<p style="font-size:0.85rem; color:var(--text-muted)">No songs currently queued.</p>`;
        return;
      }
      container.innerHTML = "";
      appState.singerQueue.forEach((item, idx) => {
        const row = document.createElement("div");
        row.className = "queue-item";
        row.innerHTML = `<strong>${idx + 1}. ${item.title}</strong><br><span style="color:var(--text-muted); font-size:0.75rem;">Singer: ${item.singer}</span>`;
        container.appendChild(row);
      });
    }

    function clearPlaybackQueue() {
      appState.singerQueue = [];
      renderQueueUI();
    }

    function loadSelectedTrackImmediately(id) {
      const tracks = appState.localFolderFiles.length > 0 ? appState.localFolderFiles : (appState.songLibrary.length > 0 ? appState.songLibrary : fallbackSongData);
      const song = tracks.find(t => t.id === id);
      stopPlaybackEngine();
      
      appState.currentSong = song;
      appState.activeLyrics = [
        { time: 0.0, text: `::: NEXT UP: ${song.title} :::` },
        { time: 2.0, text: "Get ready to sing..." },
        { time: 4.5, text: "Akin " },
        { time: 5.5, text: "ka " },
        { time: 6.5, text: "na " },
        { time: 7.5, text: "lang " },
        { time: 9.0, text: "=== TACS I.T SERVICES ===" }
      ];
      appState.playbackTime = 0;
      renderLyricsFrame();
      togglePlaybackEngine();
    }

    function togglePlaybackEngine() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const playBtn = document.getElementById("playBtn");
      
      if (appState.isPlaying) {
        appState.isPlaying = false;
        playBtn.innerText = "▶";
        clearInterval(appState.timerLoop);
      } else {
        if (!appState.currentSong) {
          loadSelectedTrackImmediately(1);
          return;
        }
        appState.isPlaying = true;
        playBtn.innerText = "⏸";
        
        appState.timerLoop = setInterval(() => {
          appState.playbackTime += 0.1 * (appState.tempoScale / 100);
          renderLyricsFrame();
          
          if (audioCtx && Math.floor(appState.playbackTime * 10) % 8 === 0) {
            try {
              const osc = audioCtx.createOscillator();
              const gainNode = audioCtx.createGain();
              
              osc.connect(gainNode);
              gainNode.connect(audioCtx.destination);
              
              const isEven = Math.floor(appState.playbackTime) % 2 === 0;
              osc.frequency.value = isEven ? 440 : 554;
              
              gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
              gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
              
              osc.start(audioCtx.currentTime);
              osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) {
    window.addEventListener('load', () => {
      const splash = document.getElementById('pwaSplash');
      if (splash) { 
        splash.style.opacity = '0'; 
        setTimeout(() => splash.remove(), 500); 
      }
      
      if (typeof supabaseClient !== 'undefined' && supabaseClient) {
        supabaseClient.from('songs').select('*').then(({ data, error }) => {
          if (!error && data && data.length > 0) { 
            appState.songLibrary = data; 
          }
          populateMediaLibrary();
        }).catch(err => {
          console.warn("Supabase load fallback triggered:", err);
          populateMediaLibrary();
        });

        supabaseClient.channel('public-songs').on('postgres_changes', { event: '*', schema: 'public', table: 'songs' }, () => {
          supabaseClient.from('songs').select('*').then(({ data }) => {
            if (data && data.length > 0) { 
              appState.songLibrary = data; 
              populateMediaLibrary(); 
            }
          });
        }).subscribe();
      } else {
        populateMediaLibrary();
      }
    });

    async function toggleAuthMock() {
      if (typeof supabaseClient === 'undefined' || !supabaseClient) {
        alert("Supabase client script asset missing from local directory. Ensure files are saved in public/lib/ path!");
        return;
      }
      try {
        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin }
        });
        if (error) throw error;
      } catch (err) {
        console.error("Auth process error:", err.message);
        alert("Authentication failed: " + err.message);
      }
    }
  </script>
</body>
</html>
