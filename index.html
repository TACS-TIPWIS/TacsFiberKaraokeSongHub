<script>
    const $ = id => document.getElementById(id);
    let db = null;
    let state = { localFiles: [], currentUser: null };

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(err => console.error('SW registration failed:', err));
    }

    function initIndexedDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open('KaraokeHubDB', 4);
            request.onerror = () => reject(request.error);
            request.onsuccess = () => {
                db = request.result;
                resolve(db);
            };
            request.onupgradeneeded = (event) => {
                const database = event.target.result;
                if (!database.objectStoreNames.contains('handles')) {
                    database.createObjectStore('handles', { keyPath: 'id', autoIncrement: true });
                }
                if (!database.objectStoreNames.contains('songs')) {
                    database.createObjectStore('songs', { keyPath: 'name' });
                }
                if (!database.objectStoreNames.contains('lyrics')) {
                    database.createObjectStore('lyrics', { keyPath: 'name' });
                }
            };
        });
    }

    function toast(message) {
        const t = $('toast');
        t.textContent = message;
        t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    function handleLogin() {
        const user = $('usernameInput').value.trim();
        const pass = $('passwordInput').value.trim();

        if (user === 'Ronel Tacocong' && pass === 'gege@635185') {
            state.currentUser = { name: user, role: 'admin' };
            document.body.classList.add('is-admin');
            $('userBadge').textContent = `Admin: ${user}`;
            $('loginModal').style.display = 'none';
            toast('Logged in as Administrator');
        } else if (user !== '') {
            state.currentUser = { name: user, role: 'user' };
            document.body.classList.remove('is-admin');
            $('userBadge').textContent = `User: ${user}`;
            $('loginModal').style.display = 'none';
            toast('Logged in as Standard User');
        } else {
            alert('Please enter valid credentials.');
        }
    }

    function handleLogout() {
        state.currentUser = null;
        document.body.classList.remove('is-admin');
        $('loginModal').style.display = 'flex';
    }

    async function storeDirectoryHandle(handle) {
        const tx = db.transaction('handles', 'readwrite');
        tx.objectStore('handles').put({ handle });
    }

    async function autoLoadPersistentStorage() {
        try {
            await initIndexedDB();
            // Instantly restore cached song list from IndexedDB on refresh
            const tx = db.transaction('songs', 'readonly');
            const req = tx.objectStore('songs').getAll();
            req.onsuccess = () => {
                const savedSongs = req.result || [];
                if (savedSongs.length > 0) {
                    state.localFiles = savedSongs;
                    renderFiles();
                    $('localStatus').textContent = `📁 Library loaded • ${savedSongs.length} file(s)`;
                } else {
                    $('localStatus').textContent = 'Select folder to load songs';
                }
            };
        } catch (err) {
            $('localStatus').textContent = 'Select folder to load songs';
        }
    }

    async function openFolderPicker() {
        if (!window.showDirectoryPicker) {
            alert('Directory Picker API not supported in this browser.');
            return;
        }
        try {
            const handle = await window.showDirectoryPicker();
            await storeDirectoryHandle(handle);
            const files = await scanDirectoryHandle(handle);
            state.localFiles = files;

            // Save song names to IndexedDB so they persist across refreshes
            const tx = db.transaction('songs', 'readwrite');
            const store = tx.objectStore('songs');
            store.clear();
            files.forEach(f => store.put({ name: f.name }));

            $('localStatus').textContent = `📁 1 folder • ${files.length} file(s)`;
            renderFiles();
            toast('Folder loaded and saved!');
        } catch (err) {
            console.error(err);
        }
    }

    async function scanDirectoryHandle(dirHandle) {
        let files = [];
        for await (const entry of dirHandle.values()) {
            if (entry.kind === 'file' && (entry.name.endsWith('.mp3') || entry.name.endsWith('.wav') || entry.name.endsWith('.mid'))) {
                files.push({ name: entry.name });
            }
        }
        return files;
    }

    async function clearLibraryStorage() {
        if (!confirm('Are you sure you want to clear stored library data?')) return;
        const txHandles = db.transaction('handles', 'readwrite');
        txHandles.objectStore('handles').clear();
        const txSongs = db.transaction('songs', 'readwrite');
        txSongs.objectStore('songs').clear();
        
        state.localFiles = [];
        $('localStatus').textContent = 'Select folder to load songs';
        renderFiles();
        toast('Library data cleared');
    }

    function renderFiles() {
        const container = $('songListContainer');
        container.innerHTML = '';
        if (state.localFiles.length === 0) {
            container.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 2rem;">No songs loaded.</p>`;
            return;
        }
        state.localFiles.forEach(file => {
            const div = document.createElement('div');
            div.className = 'song-item';
            div.innerHTML = `<span>🎵 ${file.name}</span><button class="btn small" onclick="toast('Playing ${file.name}')">Play</button>`;
            container.appendChild(div);
        });
    }

    function filterSongs() {
        const query = $('searchInput').value.toLowerCase();
        const items = document.querySelectorAll('.song-item');
        items.forEach(item => {
            const text = item.textContent.toLowerCase();
            item.style.display = text.includes(query) ? 'flex' : 'none';
        });
    }

    function handleLrcFiles(files) {
        toast(`Loaded ${files.length} LRC lyric file(s)`);
    }

    window.addEventListener('DOMContentLoaded', autoLoadPersistentStorage);
</script>
