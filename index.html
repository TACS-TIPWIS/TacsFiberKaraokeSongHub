<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaraokeHub PRO</title>
    <!-- PWA Headers & Theme Configurations -->
    <meta name="theme-color" content="#e91e63">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.json">
    
    <!-- Complete Component Dashboard UI Stylesheet -->
    <style>
        :root {
            --bg-main: #121214;
            --bg-panel: #1a1a1e;
            --accent: #e91e63;
            --accent-hover: #ff2a75;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --green: #10b981;
            --red: #ef4444;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            user-select: none;
        }

        /* PWA TACS-Branded Animated Standalone Splash Mask Layer */
        @media (display-mode: standalone) {
            .pwa-splash-fallback {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: #121214;
                z-index: 9999;
                transition: opacity 0.5s ease;
            }
            .splash-logo {
                width: 160px;
                height: 160px;
                background: url('./icons/icon-512x512.png') no-repeat center;
                background-size: contain;
                animation: pulse 2s infinite ease-in-out;
            }
            @keyframes pulse {
                0% { transform: scale(0.96); opacity: 0.8; }
                50% { transform: scale(1.03); opacity: 1; }
                100% { transform: scale(0.96); opacity: 0.8; }
            }
        }

        @media not (display-mode: standalone) {
            .pwa-splash-fallback {
                display: none !important;
            }
        }

        /* Application Layout Container Mapping */
        .app-container {
            display: grid;
            grid-template-rows: 60px 1fr 100px;
            height: 100vh;
            width: 100vw;
        }

        /* Top Action Bar Navigation */
        .top-header {
            background-color: var(--bg-panel);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #27272a;
        }

        .brand {
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--text-main);
        }

        .brand span {
            color: var(--accent);
        }

        .nav-actions button {
            background: #27272a; color: white;
            border: none;
            padding: 8px 14px;
            margin-left: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .nav-actions .btn-login {
            background-color: var(--accent);
        }

        /* Central Sing Studio Split Columns Workspace */
        .main-workspace {
            display: grid;
            grid-template-columns: 300px 1fr 320px;
            overflow: hidden;
        }

        .sidebar-panel {
            background-color: var(--bg-panel);
            border-right: 1px solid #27272a;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .sidebar-panel h3, .queue-panel h3 {
            margin-top: 0;
            font-size: 1rem;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #27272a;
            padding-bottom: 8px;
        }

        .track-scroller {
            flex: 1;
            overflow-y: auto;
        }

        .track-row {
            padding: 10px;
            border-radius: 4px;
            background: #27272a;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .track-row:hover {
            background: #3f3f46;
        }

        .track-info {
            display: flex;
            flex-direction: column;
        }

        .track-title {
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .track-artist {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .btn-reserve {
            background: var(--accent);
            border: none;
            color: white;
            border-radius: 3px;
            padding: 4px 8px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        /* Center Screen Visual Theater Output Area */
        .theater-stage {
            background-color: #09090b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        .lyric-window {
            text-align: center;
            max-height: 400px;
            width: 100%;
        }

        .lyric-line {
            font-size: 2rem;
            font-weight: 800;
            margin: 15px 0;
            text-transform: uppercase;
            transition: all 0.2s linear;
            color: #4b5563;
        }

        .lyric-line.active {
            color: #ffffff;
            text-shadow: 0 0 12px var(--accent), 0 0 24px var(--accent);
            transform: scale(1.1);
        }

        .lyric-line.passed {
            color: #fb923c;
            opacity: 0.4;
        }

        /* Right Side Live Singer Queue Panel */
        .queue-panel {
            background-color: var(--bg-panel);
            border-left: 1px solid #27272a;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .queue-list {
            flex: 1;
            overflow-y: auto;
        }

        .queue-item {
            padding: 10px;
            background: #27272a;
            border-left: 4px solid var(--accent);
            margin-bottom: 8px;
            border-radius: 0 4px 4px 0;
            font-size: 0.85rem;
        }

        .queue-triggers button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-start-queue {
            background-color: var(--green);
            color: white;
        }

        .btn-clear-queue {
            background-color: var(--red);
            color: white;
        }

        /* Bottom Matrix Audio Hardware Parameters Slider Dashboard */
        .bottom-dashboard {
            background-color: var(--bg-panel);
            border-top: 1px solid #27272a;
            display: grid;
            grid-template-columns: 240px 1fr;
            align-items: center;
            padding: 0 20px;
        }

        .transport-cluster {
            display: flex;
            gap: 10px;
        }

        .btn-transport {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: #27272a;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-transport.play-accent {
            background-color: var(--accent);
        }

        .sliders-cluster {
            display: flex;
            justify-content: space-around;
            gap: 20px;
        }

        .slider-box {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .slider-box label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .slider-box label span {
            color: white;
            float: right;
        }

        input[type="range"] {
            accent-color: var(--accent);
            background: #27272a;
            height: 6px;
            border-radius: 3px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- PWA Standalone Splash Layout View Node -->
    <div class="pwa-splash-fallback" id="pwaSplash">
        <div class="splash-logo"></div>
    </div>

    <!-- Primary Application Dashboard View Port Frame -->
    <div class="app-container">
        <!-- Top Action Bar Global Navigation Grid -->
        <header class="top-header">
            <div class="brand">KaraokeHub <span>PRO</span></div>
            <div class="nav-actions">
                <button class="btn-login" id="loginBtn" onclick="toggleAuthMock()">Log in with Google</button>
                <button onclick="alert('Manage Users Administration Framework Active')">Manage Users</button>
                <button onclick="alert('TV Stage Projector Layout Configuration Node Activated')">TV Stage</button>
            </div>
        </header>

        <!-- Central Interactive Workspace -->
        <main class="main-workspace">
            <!-- Left Column: Live Cloud Song Library Sidebar -->
            <section class="sidebar-panel">
                <h3>LOCAL SONG LIBRARY</h3>
                <div class="track-scroller" id="trackList">
    <!-- Insert this right after the closing </footer> of Part 1 -->
    <script>
        // =========================================================================
        // 1. ACTIVE MOCK DATABASES & APPLICATION GLOBAL STATES
        // =========================================================================
        const APP_CONFIG = {
            STORAGE_KEYS: {
                QUEUE: 'kh_pro_reserved_queue',
                MATRIX: 'kh_pro_hardware_matrix',
                AUTH: 'kh_pro_user_identity'
            },
            AUDIO_CONSTRAINTS: {
                echoMaxDelay: 0.8,
                vocalCutFrequency: 120,
            }
        };

        const MOCK_SONG_LIBRARY = [
            {
                id: "track-01",
                title: "Akin Ka Na Lang",
                artist: "Morissette Amon",
                lyrics: [
                    { time: 0, text: "Akin ka na lang" },
                    { time: 4, text: "Iingatan ko ang puso mo" },
                    { time: 8, text: "Akin ka na lang" },
                    { time: 11, text: "Luluha ka lang sa piling nya" }
                ]
            },
            {
                id: "track-02",
                title: "Bohemian Rhapsody",
                artist: "Queen",
                lyrics: [
                    { time: 0, text: "Is this the real life?" },
                    { time: 3, text: "Is this just fantasy?" },
                    { time: 7, text: "Caught in a landslide" },
                    { time: 10, text: "No escape from reality" }
                ]
            },
            {
                id: "track-03",
                title: "Don't Stop Believin'",
                artist: "Journey",
                lyrics: [
                    { time: 0, text: "Just a small town girl" },
                    { time: 4, text: "Livin' in a lonely world" },
                    { time: 8, text: "She took the midnight train" },
                    { time: 11, text: "Goin' anywhere" }
                ]
            }
        ];

        let singerQueue = [];
        let activeTrack = null;
        let currentTimelineSecond = 0;
        let isPlaying = false;
        let isAuthenticated = false;

        // Sub-millisecond Hardware Clock Alignment Parameters
        let animationFrameId = null;
        let playbackStartTime = 0;
        let accumulatedTime = 0;

        // Dynamic Configuration Settings Parameters Object
        const hardwareMatrix = {
            masterVolume: 80,
            microphoneVolume: 75,
            echoDepth: 40,
            vocalRemover: 0
        };

        // Web Audio Topology Context Stubs
        let audioContextInstance = null;
        let microphoneSourceNode = null;
        let masterGainNode = null;
        let micGainNode = null;
        let delayNodeInstance = null;
        let delayFeedbackNode = null;
        let vocalFilterNode = null;

        // =========================================================================
        // 2. DOM INITIALIZATION ROUTINE & COMPONENT RENDERING
        // =========================================================================
        window.addEventListener('DOMContentLoaded', () => {
            const splash = document.getElementById('pwaSplash');
            if (splash) {
                setTimeout(() => {
                    splash.style.opacity = '0';
                    setTimeout(() => splash.remove(), 500);
                }, 800);
            }

            renderSongLibrary();
            renderHardwareSliders();
            initPersistenceLayer();
        });

        function renderSongLibrary() {
            const trackListContainer = document.getElementById('trackList');
            if (!trackListContainer) return;
            trackListContainer.innerHTML = '';

            MOCK_SONG_LIBRARY.forEach(track => {
                const trackRow = document.createElement('div');
                trackRow.className = 'track-row';
                trackRow.onclick = () => loadTrackDirectly(track.id);

                trackRow.innerHTML = `
                    <div class="track-info">
                        <span class="track-title">${track.title}</span>
                        <span class="track-artist">${track.artist}</span>
                    </div>
                    <button class="btn-reserve" onclick="reserveTrack(event, '${track.id}')">+ Queue</button>
                `;
                trackListContainer.appendChild(trackRow);
            });
        }

        function renderHardwareSliders() {
            const slidersCluster = document.querySelector('.sliders-cluster');
            if (!slidersCluster) return;
            slidersCluster.innerHTML = '';

            const keys = [
                { id: 'masterVolume', label: 'Master Volume' },
                { id: 'microphoneVolume', label: 'Mic Volume' },
                { id: 'echoDepth', label: 'Echo Depth' },
                { id: 'vocalRemover', label: 'Vocal Cut' }
            ];

            keys.forEach(item => {
                const sliderBox = document.createElement('div');
                sliderBox.className = 'slider-box';
                sliderBox.innerHTML = `
                    <label>${item.label} <span id="${item.id}Val">${hardwareMatrix[item.id]}%</span></label>
                    <input type="range" min="0" max="100" value="${hardwareMatrix[item.id]}" oninput="adjustHardwareParameter('${item.id}', this.value)">
                `;
                slidersCluster.appendChild(sliderBox);
            });
        }

        function initPersistenceLayer() {
            try {
                const savedMatrix = localStorage.getItem(APP_CONFIG.STORAGE_KEYS.MATRIX);
                if (savedMatrix) {
                    const parsed = JSON.parse(savedMatrix);
                    Object.keys(parsed).forEach(key => {
                        hardwareMatrix[key] = parsed[key];
                        const inputEl = document.querySelector(`input[oninput*="${key}"]`);
                        if (inputEl) inputEl.value = parsed[key];
                        const valLabel = document.getElementById(`${key}Val`);
                        if (valLabel) valLabel.innerText = `${parsed[key]}%`;
                    });
                }

                const savedQueue = localStorage.getItem(APP_CONFIG.STORAGE_KEYS.QUEUE);
                if (savedQueue) {
                    singerQueue = JSON.parse(savedQueue);
                    updateQueueUI();
                }

                const savedAuth = localStorage.getItem(APP_CONFIG.STORAGE_KEYS.AUTH);
                if (savedAuth) {
                    isAuthenticated = true;
                    const btn = document.getElementById('loginBtn');
                    if (btn) {
                        btn.innerText = 'Log Out';
                        btn.style.backgroundColor = '#4b5563';
                    }
                }
            } catch (err) {
                console.error("Failure during persistence layout hydration cycle:", err);
            }
        }

        // =========================================================================
        // 3. HIGH-PRECISION LYRIC TIMELINE PLAYBACK ENGINE
        // =========================================================================
        function loadTrackDirectly(trackId) {
            const track = MOCK_SONG_LIBRARY.find(t => t.id === trackId);
            if (!track) return;
            
            stopPlaybackEngine();
            activeTrack = JSON.parse(JSON.stringify(track)); 
            currentTimelineSecond = 0;
            accumulatedTime = 0;
            updateTheaterLyrics();
            
            togglePlaybackEngine(true);
        }

        function togglePlaybackEngine(forceState = null) {
            const playBtn = document.getElementById('playBtn');
            const targetState = forceState !== null ? forceState : !isPlaying;

            if (targetState) {
                if (!activeTrack && singerQueue.length > 0) {
                    advancePlaybackQueue();
                    return;
                }
                if (!activeTrack) return;

                initializeAudioHardwareGraph();
                if (audioContextInstance && audioContextInstance.state === 'suspended') {
                    audioContextInstance.resume();
                }

                isPlaying = true;
                playBtn.innerHTML = '⏸';
                
                // Pin performance clock precisely to this exact millisecond anchor
                playbackStartTime = performance.now() - (accumulatedTime * 1000);
                renderPlaybackLoop();
            } else {
                isPlaying = false;
                playBtn.innerHTML = '▶';
                
                if (playbackStartTime > 0) {
                    accumulatedTime = (performance.now() - playbackStartTime) / 1000;
                }
                
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                }
            }
        }

        function renderPlaybackLoop() {
            if (!isPlaying) return;

            const currentTimeMs = performance.now() - playbackStartTime;
            const preciseSeconds = currentTimeMs / 1000;

            // Only redraw visual nodes if the math calculation shifts over a full integer mark
            if (Math.floor(preciseSeconds) !== currentTimelineSecond) {
                currentTimelineSecond = Math.floor(preciseSeconds);
                updateTheaterLyrics();
            }

            animationFrameId = requestAnimationFrame(renderPlaybackLoop);
        }

        function stopPlaybackEngine() {
            isPlaying = false;
            const playBtn = document.getElementById('playBtn');
            if (playBtn) playBtn.innerHTML = '▶';
            
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }

    <!-- Insert this block directly after your Part 2 script block to complete the application ecosystem -->
    <script>
        // =========================================================================
        // 1. EXTENDED LOCAL DATABASE PERSISTENCE ENGINES
        // =========================================================================
        function saveQueueToDisk() {
            try {
                localStorage.setItem(APP_CONFIG.STORAGE_KEYS.QUEUE, JSON.stringify(singerQueue));
            } catch (err) {
                console.error("Storage write failure on Singer Queue payload partition:", err);
            }
        }

        function saveHardwareMatrixToDisk() {
            try {
                localStorage.setItem(APP_CONFIG.STORAGE_KEYS.MATRIX, JSON.stringify(hardwareMatrix));
            } catch (err) {
                console.error("Storage write failure on custom DSP matrix configuration profile:", err);
            }
        }

        // Hooking application mutations securely to guarantee silent state persistence updates
        const systemReserveTrack = reserveTrack;
        reserveTrack = function(event, trackId) {
            systemReserveTrack(event, trackId);
            saveQueueToDisk();
        };

        const systemClearPlaybackQueue = clearPlaybackQueue;
        clearPlaybackQueue = function() {
            systemClearPlaybackQueue();
            saveQueueToDisk();
        };

        const systemAdvancePlaybackQueue = advancePlaybackQueue;
        advancePlaybackQueue = function() {
            systemAdvancePlaybackQueue();
            saveQueueToDisk();
        };

        const systemAdjustHardwareParameter = adjustHardwareParameter;
        adjustHardwareParameter = function(key, value) {
            systemAdjustHardwareParameter(key, value);
            saveHardwareMatrixToDisk();
        };

        // =========================================================================
        // 2. PRODUCTION OAUTH2 COMPLIANCE INTERFACE SKELETON
        // =========================================================================
        function initiateOAuth2Flow() {
            // Live production systems will override the mock login toggles to handle target redirects
            const oauthEndpoint = "https://google.com";
            const runtimeParams = {
                client_id: "REPLACE_WITH_YOUR_DEDICATED_GOOGLE_CLIENT_://googleusercontent.com",
                redirect_uri: window.location.origin + window.location.pathname,
                response_type: "token",
                scope: "https://googleapis.com email"
            };

            console.log("Redirecting system authentication layout node state to identity provider pipeline...", oauthEndpoint);
            
            // For interface simulation parity, we delegate down to the standard UI switch
            toggleAuthMock();
        }

        // =========================================================================
        // 3. APPLICATION SYSTEM VERIFICATION & LOGGING RUNTIME
        // =========================================================================
        window.addEventListener('load', () => {
            console.log("KaraokeHub PRO State Framework Engine V3 initialized smoothly.");
            
            // Check if hardware acceleration frameworks are active inside user agent sandbox layers
            if (!window.AudioContext && !window.webkitAudioContext) {
                console.error("Web Audio API is not supported in this browser version. Voice processing loops will be bypassed.");
            } else {
                console.log("Sub-millisecond audio hardware processing loop profiles mapped successfully.");
            }
        });
    </script>
